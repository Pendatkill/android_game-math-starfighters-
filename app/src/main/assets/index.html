<body>
<canvas id="c"></canvas>
<script>
'use strict';
if(!window.ART){window.ART=window.ART_STUB;}
// ================== CONFIG ==================
const cv=document.getElementById('c'),cx=cv.getContext('2d');
const H=720,SHIPX=260,SR=15,VMAX=560,GRAV=1700,THRUST=1700;
const FONT='system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
let W=1280,scale=1,dpr=1,portrait=false;
function resize(){dpr=Math.min(window.devicePixelRatio||1,2);const w=window.innerWidth,h=window.innerHeight;portrait=h>w*1.05;scale=h/H;W=w/scale;cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);}
window.addEventListener('resize',resize);resize();

// ================== GUARDADO ==================
const SKEY='mathstarfighters_v1';
let save={ship:0,introSeen:false,unlocked:1,best:{},stars:{},done:{},attempts:0,endless:0,muted:false,practice:false};
try{const s=JSON.parse(localStorage.getItem(SKEY));if(s)save=Object.assign(save,s);}catch(e){}
function persist(){try{localStorage.setItem(SKEY,JSON.stringify(save));}catch(e){}}
function totalStars(){let t=0;for(const k in save.stars)for(const v of save.stars[k])t+=v?1:0;return t;}
function doneCount(){return Object.keys(save.done).length;}
function rank(){const d=doneCount(),s=totalStars();
  if(d>=50&&s>=150)return'Leyenda Galáctica';if(d>=50)return'Gran Almirante';if(d>=35)return'Comandante';if(d>=20)return'Capitán';if(d>=8)return'Piloto';if(d>=1)return'Cadete piloto';return'Cadete espacial';}

// ================== NIVELES ==================
const THEME_ORDER=['hangar','space','desert','ice','forest','lava','city','tunnel','storm','dark'];

const DEATH=['¡Casi lo tienes, piloto!','Los grandes pilotos fallan... ¡y lo vuelven a intentar!','¡Cada intento te hace más rápido!','¡Venga, piloto! ¡Tú puedes!','Respira... ¡y a por ello otra vez!','¡Esa nave no se va a pilotar sola!','Hasta los capitanes chocan a veces 😉','¡Tu cerebro ya está aprendiendo el camino!','¡Uy! Ese muro tenía tu nombre... ¡literal!','¡Otra vez! Esta es la buena 🚀'];
const REC=['¡Más lejos que nunca! 🏆','¡NUEVO RÉCORD! ¡Eres imparable!','¡Lo estás petando, piloto!'];
const WINS=['¡Eres el mejor piloto de la galaxia!','¡Increíble, piloto! ¡Nivel dominado!','¡Pilotaje de leyenda!','¡Toda la flota está orgullosa de ti!'];
const PROG=[{p:.25,t:'¡Buen vuelo, piloto! 🚀',c:'#7ff'},{p:.5,t:'¡MITAD DEL CAMINO!',c:'#ff7'},{p:.75,t:'¡Ya casi! ¡No te rindas!',c:'#f9f'},{p:.92,t:'¡¡LA META ESTÁ AHÍ!!',c:'#7f7'}];
const DAILY=['Hoy es un gran día para pilotar 🚀','Los pilotos valientes nunca se rinden','Cada choque te enseña algo nuevo','La galaxia necesita buenos pilotos','Concentración de piloto: ¡activada!','¡Hoy vas a batir tu récord!'];
const pickArr=a=>a[Math.floor(Math.random()*a.length)];
const dailyMsg=pickArr(DAILY);

// ================== GENERADOR ==================
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function nextCY(st,dist,gap,speed){const d=dist/speed*VMAX*(st.vary||0.4),lo=gap/2+45,hi=H-gap/2-45;return clamp(st.cy+(st.rnd()*2-1)*d,lo,hi);}
function pushPair(st,x,w,cy,gap,style,move){
  const tu=style==='wall'&&w>=90&&st.rnd()<.22;
  st.obs.push({k:'rect',x,y:-700,w,h:cy-gap/2+700,style,top:1,move,tur:tu&&st.rnd()<.5});
  st.obs.push({k:'rect',x,y:cy+gap/2,w,h:H-(cy+gap/2)+700,style,top:0,move,tur:false});
}
function pick(st,x,cy,gap){
  if(st.stars&&st.si<st.stars.length&&x>=st.stars[st.si]){st.obs.push({k:'star',x,y:cy+(st.rnd()<.5?-1:1)*(gap/2-42),idx:st.si,got:0});st.si++;}
  else if(st.rnd()<0.6)st.obs.push({k:'gem',x,y:cy,got:0});
}
function mkMove(center,amp,f,speed){const k=f/speed;return{a:amp,k,p:-(center-SHIPX)*k};}
function off(o,cam){return o.move?o.move.a*Math.sin(cam*o.move.k+o.move.p):0;}
function mkAst(st,x,y,r){const pts=[];for(let i=0;i<9;i++)pts.push(0.78+st.rnd()*0.32);return{k:'ast',x,y,r,pts,rot:st.rnd()*6,spin:(st.rnd()-.5)*2};}

function genNext(st){
  const P=st.params(st.x),r=st.rnd,gap=P.gap,sp=P.sp,spd=P.speed;st.vary=P.vary||0.4;
  let x=st.x;
  const type=P.types[Math.floor(r()*P.types.length)];
  switch(type){
    case 'pillars':{const n=1+Math.floor(r()*3);for(let i=0;i<n;i++){st.cy=nextCY(st,sp,gap,spd);pushPair(st,x,90,st.cy,gap,'wall');pick(st,x+45,st.cy,gap);x+=sp;}break;}
    case 'wall':{const w=240+Math.floor(r()*200),g=gap*1.06;st.cy=nextCY(st,sp,g,spd);pushPair(st,x,w,st.cy,g,'big');pick(st,x+w/2,st.cy,g);x+=w+sp;break;}
    case 'asteroids':{const n=3+Math.floor(r()*2);for(let i=0;i<n;i++){st.cy=nextCY(st,i?170:sp,gap,spd);const cy=st.cy;
        let ra=28+r()*26;st.obs.push(mkAst(st,x,cy-gap/2-ra*0.85-r()*30,ra));
        ra=28+r()*26;st.obs.push(mkAst(st,x+r()*40,cy+gap/2+ra*0.85+r()*30,ra));

function makeQuiz(t){
  const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
  const kinds=[['add'],['add','sub'],['add','sub','mul','seq','cmp'],['mul','sub','seq','dbl','half','cmp'],['mul','seq','dbl','half','mix','let','cmp']][t];
  const k=kinds[R(0,kinds.length-1)];let q,a,labels=null,expl;
  switch(k){
    case 'add':{const m=t===0?9:t===1?15:40;const x=R(1,m),y=R(1,m);q=`${x} + ${y} = ?`;a=x+y;break;}
    case 'sub':{const m=t<=1?20:60;const x=R(6,m),y=R(1,x-1);q=`${x} - ${y} = ?`;a=x-y;break;}
    case 'mul':{const m=t===2?5:9;const x=R(2,m),y=R(2,t===2?5:10);q=`${x} × ${y} = ?`;a=x*y;break;}
    case 'seq':{const s=R(1,9),dd=t===2?R(2,5):R(3,12);q=`¿Qué número sigue?  ${s}, ${s+dd}, ${s+2*dd}, ?`;a=s+3*dd;expl=`${s}, ${s+dd}, ${s+2*dd}, ${a}  (de ${dd} en ${dd})`;break;}
    case 'dbl':{const x=R(6,t>=4?50:25);q=`El doble de ${x} es...`;a=2*x;expl=`El doble de ${x} es ${a}`;break;}
    case 'half':{const x=R(3,t>=4?40:20)*2;q=`La mitad de ${x} es...`;a=x/2;expl=`La mitad de ${x} es ${a}`;break;}
    case 'mix':{const x=R(2,9),y=R(2,9),z=R(1,20);q=`${x} × ${y} + ${z} = ?`;a=x*y+z;break;}
    case 'cmp':{const p=R(1,9),r=R(1,9);let A=[p*10+r,r*10+p,p*10+p];if(p===r)A=[p*10+r,p*10+r+1,p*10+r-1];A=[...new Set(A)];while(A.length<3)A.push(A[0]+R(2,9));
      q='¿Cuál es el número MAYOR?';a=Math.max(...A);labels=[a,...A.filter(v=>v!==a)].map(String);expl=`El mayor es ${a}`;break;}
    case 'let':{const AB='ABCDEFGHIJKLMNOPQRSTUVWXYZ',s=R(0,10),dd=R(1,3);q=`¿Qué letra sigue?  ${AB[s]}, ${AB[s+dd]}, ${AB[s+2*dd]}, ?`;const c=AB[s+3*dd];
      labels=[c,AB[s+3*dd+1],AB[Math.max(0,s+3*dd-1)]===c?AB[s+3*dd+2]:AB[s+3*dd-1]];a=c;expl=`${AB[s]}, ${AB[s+dd]}, ${AB[s+2*dd]}, ${c}`;break;}
  }
  if(!labels){const opts=new Set();const cand=[1,-1,2,-2,10,-10,3,-3,5];for(const o of cand.sort(()=>Math.random()-.5)){const v=a+o;if(v>=0&&v!==a)opts.add(v);if(opts.size>=2)break;}labels=[a,...opts].map(String);}
  const order=[0,1,2].sort(()=>Math.random()-.5);const L2=order.map(i=>labels[i]);
  return{q,labels:L2,ans:order.indexOf(0),expl:expl||q.replace('?',String(a))};
}
function genPuzzle(st,type,P,tier){

    for(let i=0;i<edges.length;i+=2)st.obs.push({k:'rect',x:gx,y:edges[i],w,h:edges[i+1]-edges[i],style:'wall',top:i===0?1:0,qg:1});

}

function pickR(r,a){return a[Math.floor(r()*a.length)];}
const themeCache={};
const themeOrder=[];
function getTheme(k){
  if(themeCache[k]){const i=themeOrder.indexOf(k);if(i>=0){themeOrder.splice(i,1);themeOrder.push(k);}return themeCache[k];}
  const T={mids:[]};
  const mk=(p,seed)=>{const c=document.createElement('canvas');c.width=TW;c.height=H;const g=c.getContext('2d');p(g,rng(seed));return c;};
  if(PAINT[k].far)T.far=mk(PAINT[k].far,k.length*977+1);
  if(PAINT[k].mid)for(let v=0;v<3;v++){GVAR=v;T.mids.push(mk(PAINT[k].mid,k.length*977+7+v*1013));}GVAR=0;
  themeOrder.push(k);while(themeOrder.length>4){const old=themeOrder.shift();if(old!==(G&&G.theme))delete themeCache[old];else themeOrder.push(old);}
  return themeCache[k]=T;
}
function drawMids(T,scroll,f){if(!T.mids.length)return;const s=scroll*f;let i0=Math.floor(s/TW);for(let x=i0*TW-s,i=i0;x<W;x+=TW,i++){cx.drawImage(T.mids[((i%3)+3)%3],x,0,TW,H);}}
function drawLayer(c,scroll,f){if(!c)return;const o=((scroll*f)%TW+TW)%TW;for(let x=-o;x<W;x+=TW)cx.drawImage(c,x,0,TW,H);}
const FX=[];for(let i=0;i<70;i++)FX.push({x:Math.random()*2000,y:Math.random()*H,v:Math.random(),p:Math.random()*6});
let flash=0;
function drawFx(k,dt,spd){
  const t=THEMES[k].fx;if(!t)return;
  for(const p of FX){let x=p.x%W;if(x<0)x+=W;
    switch(t){
      case 'dust':p.x-=dt*(20+spd*.05)*(1+p.v);p.y+=Math.sin(clock+p.p)*dt*8;cx.fillStyle=`rgba(200,220,255,${.15+p.v*.2})`;cx.fillRect(x,p.y,2,2);break;
      case 'sand':p.x-=dt*(300+spd*.6)*(1+p.v);p.y+=dt*30*(p.v-.4);cx.fillStyle=`rgba(255,220,170,${.25+p.v*.3})`;cx.fillRect(x,p.y,10+p.v*14,2);break;
      case 'snow':p.x-=dt*(60+spd*.35)*(.5+p.v);p.y+=dt*(40+p.v*60);cx.fillStyle='rgba(255,255,255,.8)';cx.beginPath();cx.arc(x,p.y,1.5+p.v*2.5,0,6.283);cx.fill();break;
      case 'fireflies':p.x-=dt*(15+spd*.08);p.y+=Math.sin(clock*1.3+p.p)*dt*20;{const a=.3+.7*Math.max(0,Math.sin(clock*2+p.p*3));cx.fillStyle=`rgba(210,255,120,${a})`;cx.beginPath();cx.arc(x,p.y,2.5,0,6.283);cx.fill();}break;
      case 'embers':p.x-=dt*(40+spd*.2);p.y-=dt*(40+p.v*90);cx.fillStyle=`rgba(255,${120+p.v*100|0},40,${.5+p.v*.5})`;cx.fillRect(x,p.y,3,3);break;
      case 'traffic':{const lane=Math.floor(p.p)%5,ly=170+lane*45,dir=lane%2?1:-1;p.x+=dt*dir*(120+p.v*160)-dt*spd*.3;cx.fillStyle=dir>0?'rgba(255,90,90,.85)':'rgba(255,240,200,.9)';cx.fillRect(x,ly+p.v*10,12,3);break;}
      case 'sparks':if(p.y>H){p.y=0;p.x=Math.random()*W;}p.y+=dt*(150+p.v*300);p.x-=dt*spd*.2;if(p.v>.7){cx.fillStyle='rgba(255,210,90,.9)';cx.fillRect(x,p.y,2,6);}break;
      case 'rain':p.x-=dt*(200+spd*.5);p.y+=dt*(600+p.v*300);cx.strokeStyle='rgba(180,190,255,.35)';cx.lineWidth=1.5;cx.beginPath();cx.moveTo(x,p.y);cx.lineTo(x+8,p.y-18);cx.stroke();break;
    }
    if(p.y>H+10)p.y=-10;if(p.y<-10)p.y=H+10;
  }
  if(t==='rain'){flash=Math.max(0,flash-dt*3);if(Math.random()<dt*.25)flash=1;if(flash>0){cx.fillStyle=`rgba(230,220,255,${flash*.25})`;cx.fillRect(0,0,W,H);}}
}
function drawBG(scroll,k,dt,spd){
  const th=THEMES[k],T=getTheme(k);
  const g=cx.createLinearGradient(0,0,0,H);g.addColorStop(0,th.sky[0]);g.addColorStop(1,th.sky[1]);cx.fillStyle=g;cx.fillRect(0,0,W,H);
  if(th.stars){const f=[.03,.08,.2];for(let l=0;l<3;l++){cx.fillStyle=`rgba(230,235,255,${(.35+l*.25)*th.stars})`;for(const s of stars3[l]){let x=(s.x*W-scroll*f[l])%W;if(x<0)x+=W;cx.fillRect(x,s.y,s.s,s.s);}}}
  if(k==='space'||k==='dark'){for(let i=0;i<2;i++){const span=W+900;const nx=((i*700+W*.6-scroll*(.02+i*.015))%span+span)%span-450,ny=i?H*.7:H*.3;const rg=cx.createRadialGradient(nx,ny,0,nx,ny,380);rg.addColorStop(0,`hsla(${(th.edge+i*70)%360},90%,55%,.2)`);rg.addColorStop(1,'rgba(0,0,0,0)');cx.fillStyle=rg;cx.fillRect(nx-400,ny-400,800,800);}
    const span=W+600,px=((W*.85-scroll*.04)%span+span)%span-300,py=H*.22;const pg=cx.createRadialGradient(px-25,py-25,5,px,py,70);pg.addColorStop(0,k==='dark'?'#6a2030':'#7fd0ff');pg.addColorStop(1,'#101020');cx.fillStyle=pg;cx.beginPath();cx.arc(px,py,70,0,6.283);cx.fill();}
  if(PAINT[k].sky)PAINT[k].sky(cx,scroll);
  drawLayer(T.far,scroll,.12);
  ambientBattle(k,dt||0,spd||0);
  if(!bgNoMid)drawMids(T,scroll,.35);
  cx.fillStyle='rgba(0,0,10,.2)';cx.fillRect(0,0,W,H);
  drawFx(k,dt||0,spd||0);
}

const AMB={ships:[],bolts:[],t:0};
function ambientBattle(k,dt,spd){
  if(!(k in {space:1,dark:1,storm:1,city:1,ice:1,hangar:0}))return;

  for(const s of A.ships){s.x+=s.vx*dt-spd*.05*dt;s.y+=Math.sin(clock*2+s.fire*6)*12*dt;s.fire-=dt;
    if(s.fire<0){s.fire=.6+Math.random()*1.2;A.bolts.push({x:s.x,y:s.y,vx:s.vx*3,c:s.vx<0?'#ff3b4a':'#45ff7a',l:.9});}
    cx.save();cx.globalAlpha=.6;
    if(window.ART&&ART.npcShip){try{cx.translate(s.x,s.y);if(s.vx<0)cx.scale(-1,1);ART.npcShip(cx,s.kind,0,0,.45,clock);}catch(e){}}
    else{cx.translate(s.x,s.y);if(s.vx<0)cx.scale(-1,1);cx.fillStyle='#8894aa';cx.beginPath();cx.moveTo(14,0);cx.lineTo(-10,-6);cx.lineTo(-6,0);cx.lineTo(-10,6);cx.closePath();cx.fill();cx.fillStyle='#ff9a3a';cx.fillRect(-12,-1.5,4,3);}
    cx.restore();}
  A.ships=A.ships.filter(s=>s.x>-80&&s.x<W+80);
  cx.lineWidth=2.5;for(const b of A.bolts){b.x+=b.vx*dt;b.l-=dt;cx.strokeStyle=hexA(b.c,.75);cx.beginPath();cx.moveTo(b.x,b.y);cx.lineTo(b.x-Math.sign(b.vx)*26,b.y);cx.stroke();}
  A.bolts=A.bolts.filter(b=>b.l>0);
}

      else{ART.wall(cx,G.theme,x,oy,o.w,o.h,!!o.top,o.style==='wall'?'wall':o.style,clock);
        if(o.tur&&ART.turret)ART.turret(cx,G.theme,x+o.w/2,o.top?oy+o.h:oy,!!o.top,clock);}
      break;}

    case 'portal':ART.portal(cx,x,!!o.used,clock);break;

function drawAbout(){
  drawBG(menuScroll*.3,'space',lastDt,30);overlay(.45);vignette();
  btn(18,18,150,54,'◀ MENÚ',()=>{scr='menu';},{fs:18,c:'#c08bff'});
  const pw=Math.min(980,W-80),ph=520,px=W/2-pw/2,py=H/2-ph/2+20;panel(px,py,pw,ph,'ACERCA DE');
  const R=150,lx=px+40+R,ly=py+ph/2+20;
  cx.save();cx.beginPath();cx.arc(lx,ly,R,0,6.283);cx.fillStyle='#e9e9e9';cx.fill();cx.clip();
  if(LOGO.complete&&LOGO.naturalWidth)cx.drawImage(LOGO,lx-R*1.04,ly-R*1.04,R*2.08,R*2.08);cx.restore();
  cx.lineWidth=4;cx.strokeStyle=hexA(CYAN,.8);cx.beginPath();cx.arc(lx,ly,R+4,0,6.283);cx.stroke();
  cx.strokeStyle=hexA(CYAN,.25);cx.lineWidth=12;cx.beginPath();cx.arc(lx,ly,R+12,clock,clock+2);cx.stroke();
  const tx=lx+R+50,tw=px+pw-40-tx;
  const t1='MATH STARFIGHTERS';txt(t1,tx,py+110,fitSize(t1,40,tw,FL,400),'#ffc21a','left',400,FL);
  {const L=['Juego didáctico para niños:','pensar rápido, aprender matemáticas','y alimentar las ganas de jugar','con las ganas de aprender.'];
   L.forEach((l,i)=>txt(l,tx,py+170+i*36,fitSize(l,24,tw,FB,700),i===0?'#ffd23f':'#e6f2ff','left',700));}
  cx.fillStyle=hexA(CYAN,.4);cx.fillRect(tx,py+330,tw,2);
  glowT('PENDATKILL-DEV',tx,py+372,fitSize('PENDATKILL-DEV',36,tw,FL,400),'#7ae8ff','left',FL,400);
  txt('¡Que disfrutes cada misión, piloto!',tx,py+430,fitSize('¡Que disfrutes cada misión, piloto!',18,tw,FB,700),'#7dff9a','left',700);
}

let mapSel=-1;
function nodePos(i){const x0=110,x1=W-110;return{x:x0+(x1-x0)*i/9,y:H*.47+Math.sin(i*1.15+.4)*130};}
let missionSel=1;
function planetDone(w){for(let k=1;k<=5;k++)if(!save.done[w*5+k])return false;return true;}
function planetStars(w){let t=0;for(let k=1;k<=5;k++){const st=save.stars[w*5+k];if(st)for(const v of st)t+=v?1:0;}return t;}
function firstOpen(w){for(let k=1;k<=5;k++){const n=w*5+k;if(n<=save.unlocked&&!save.done[n])return n;}return Math.min(save.unlocked,w*5+5);}

  btn(W-268,18,250,54,save.practice?'PRÁCTICA: SÍ':'PRÁCTICA: NO',()=>{save.practice=!save.practice;persist();},{fs:17,c:save.practice?'#7dff9a':CYAN});
  cx.lineWidth=3;cx.setLineDash([10,10]);cx.lineDashOffset=-clock*30;
  for(let i=0;i<9;i++){const a=nodePos(i),b=nodePos(i+1),done=planetDone(i);cx.strokeStyle=done?hexA('#7dff9a',.8):'rgba(140,170,220,.3)';cx.beginPath();cx.moveTo(a.x,a.y);
    cx.quadraticCurveTo((a.x+b.x)/2,(a.y+b.y)/2+(i%2?40:-40),b.x,b.y);cx.stroke();}
  cx.setLineDash([]);
  const cur=Math.min(9,Math.floor((save.unlocked-1)/5));
  for(let i=0;i<10;i++){const p=nodePos(i),th=THEME_ORDER[i],locked=i*5+1>save.unlocked,done=planetDone(i),r=i===9?44:34+(i%3)*3;
    if(i===cur||i===mapSel){cx.strokeStyle=hexA(i===mapSel?AMBER:CYAN,.5+.4*Math.sin(clock*4));cx.lineWidth=3;cx.beginPath();cx.arc(p.x,p.y,r+14+Math.sin(clock*4)*3,0,6.283);cx.stroke();}
    drawPlanet(th,p.x,p.y,r,locked);
    if(locked)txt('🔒',p.x,p.y,24,'#fff');
    if(done){cx.fillStyle='#14a04a';cx.beginPath();cx.arc(p.x+r*.75,p.y-r*.75,11,0,6.283);cx.fill();txt('✔',p.x+r*.75,p.y-r*.75+1,13,'#fff',undefined,900);}
    const lw=(W-220)/9-8,nm=THEMES[th].n.toUpperCase();
    txt(nm,p.x,p.y+r+20,fitSize(nm,12,lw,FT,800),locked?'#556':'rgba(220,240,255,.9)',undefined,800,FT);
    if(!locked){txt(`★ ${planetStars(i)}/15`,p.x,p.y+r+38,12,'#ffd23f',undefined,800,FT);
      buttons.push({x:p.x-r-14,y:p.y-r-14,w:2*r+28,h:2*r+70,fn:()=>{mapSel=i;missionSel=firstOpen(i);S.sfx('click');}});}
    if(i===cur){const a=clock*1.6;drawPlayerShip(p.x+Math.cos(a)*(r+26),p.y+Math.sin(a)*(r+26)*.5,a+Math.PI/2,1,true,.55);}
  }
  if(mapSel>=0)drawBrief(mapSel);
  else txt('TOCA UN PLANETA PARA ELEGIR MISIÓN',W/2,H-30,14,'rgba(200,230,255,.6)',undefined,800,FT);
}
function drawBrief(w){
  const th=THEME_ORDER[w],TH=THEMES[th],pw=Math.min(980,W-40),ph=220,px=W/2-pw/2,py=H-ph-10,n=missionSel,L=LEVELS[n-1];
  buttons.unshift({x:0,y:0,w:W,h:H,fn:()=>{mapSel=-1;}});
  panel(px,py,pw,ph,null,AMBER);buttons.push({x:px,y:py,w:pw,h:ph,fn:()=>{}});
  drawPlanet(th,px+90,py+ph/2,58,false);
  txt(`PLANETA ${w+1}`,px+170,py+30,13,AMBER,'left',900,FT);
  txt(TH.n.toUpperCase(),px+170,py+58,fitSize(TH.n.toUpperCase(),26,pw-470,FT,900),'#fff','left',900,FT);
  const mw=Math.min(96,(pw-470)/5-8);
  for(let k=1;k<=5;k++){const m=w*5+k,locked=m>save.unlocked,sel=m===n,bx=px+170+(k-1)*(mw+8),by=py+86;
    chamfer(bx,by,mw,64,10);cx.fillStyle=sel?'rgba(255,176,46,.25)':'rgba(10,24,48,.85)';cx.fill();cx.lineWidth=sel?2.5:1.5;cx.strokeStyle=locked?'#445':sel?AMBER:save.done[m]?'#7dff9a':hexA(CYAN,.7);cx.stroke();
    txt(locked?'🔒':String(m),bx+mw/2,by+24,locked?18:22,locked?'#667':'#fff',undefined,900,FT);
    const st=save.stars[m]||[0,0,0];if(!locked)for(let q=0;q<3;q++)drawStarIcon(bx+mw/2+(q-1)*15,by+48,5.5,st[q]);
    if(!locked)buttons.push({x:bx,y:by,w:mw,h:64,fn:()=>{missionSel=m;}});}
  const info=`${L.name.toUpperCase()}  ·  ${save.done[n]?'COMPLETADA':save.best[n]?'RÉCORD '+save.best[n]+'%':'SIN EXPLORAR'}`;
  txt(info,px+170,py+172,13,save.done[n]?'#7dff9a':'#9fb6d8','left',800,FT);
  const pz=[L.quiz?`${L.quiz} pregunta${L.quiz>1?'s':''}`:'',L.keys?`${L.keys} llave${L.keys>1?'s':''}`:''].filter(Boolean).join(' · ');
  txt((pz?pz+'  ·  ':'')+L.tip,px+170,py+198,fitSize((pz?pz+'  ·  ':'')+L.tip,15,pw-470),'#cfe6ff','left',600);
  btn(px+pw-270,py+ph/2-46,240,92,`MISIÓN ${n}`,()=>{jump(()=>startLevel(n,false),()=>getTheme(LEVELS[n-1].theme));},{primary:true,fs:26,sub:save.practice?'modo práctica · despegar':'¡despegar!'});
}
// ---------- Hangar ----------
let hangSel=0;
const SHIP_DESC=['Caza ligero y veloz. ¡El clásico del escuadrón!','Alas curvas para planear entre asteroides.','Carguero blindado con dos motores laterales.','Interceptor de fuego. Brilla como el sol.','Nave secreta de la Estación Oscura.'];
function drawHangar(){
  drawBG(menuScroll*.2,'hangar',lastDt,40);overlay(.35);vignette();
  glowT('HANGAR',W/2,46,40,CYAN);btn(18,18,150,54,'◀ MENÚ',()=>{scr='menu';},{fs:18,c:'#c08bff'});
  const i=hangSel,un=shipUnlocked(i),sel=(save.ship||0)===i,cxm=W/2,cym=H*.45;
  // plataforma holográfica
  cx.save();cx.translate(cxm,cym+110);for(let k=0;k<3;k++){cx.strokeStyle=hexA(CYAN,.5-k*.13);cx.lineWidth=3-k;cx.beginPath();cx.ellipse(0,0,220-k*40,40-k*7,0,0,6.283);cx.stroke();}
  cx.rotate(0);cx.strokeStyle=hexA(CYAN,.8);cx.lineWidth=3;cx.beginPath();cx.ellipse(0,0,220,40,0,clock%6.283,(clock%6.283)+1.2);cx.stroke();cx.restore();
  const hg=cx.createLinearGradient(0,cym-60,0,cym+110);hg.addColorStop(0,'rgba(56,214,255,0)');hg.addColorStop(1,'rgba(56,214,255,.18)');cx.fillStyle=hg;cx.beginPath();cx.moveTo(cxm-150,cym+110);cx.lineTo(cxm-90,cym-60);cx.lineTo(cxm+90,cym-60);cx.lineTo(cxm+150,cym+110);cx.fill();
  cx.save();if(!un)cx.globalAlpha=.22;drawPlayerShip(cxm,cym+Math.sin(clock*2)*8,Math.sin(clock*1.3)*.06,1,un,3.6,i);cx.restore();
  if(!un)txt('🔒',cxm,cym,56,'#fff');
  glowT(SHIPS[i].n.toUpperCase(),cxm,cym+170,fitSize(SHIPS[i].n.toUpperCase(),34,W*.6,FT,900),un?'#ffffff':'#8899aa');
  txt(SHIP_DESC[i],cxm,cym+208,fitSize(SHIP_DESC[i],19,W*.7),'rgba(210,235,255,.85)',undefined,600);
  btn(cxm-330,cym-40,90,90,'◀',()=>{hangSel=(hangSel+SHIPS.length-1)%SHIPS.length;},{fs:34});
  btn(cxm+240,cym-40,90,90,'▶',()=>{hangSel=(hangSel+1)%SHIPS.length;},{fs:34});
  const by=H-96;
  if(sel)btn(cxm-170,by,340,70,'✔ EN USO',null,{c:'#7dff9a',tc:'#7dff9a'});
  else if(un)btn(cxm-170,by,340,70,'SELECCIONAR',()=>{save.ship=i;persist();S.sfx('unlock');},{primary:true});
  else btn(cxm-170,by,340,70,`🔒 ${shipReq(i).toUpperCase()}`,null,{dis:true,fs:18,sub:SHIPS[i].req>0?`tienes ★ ${totalStars()}`:null});
  for(let k=0;k<SHIPS.length;k++){cx.fillStyle=k===i?CYAN:'rgba(255,255,255,.25)';cx.beginPath();cx.arc(cxm+(k-2)*20,by-22,k===i?6:4,0,6.283);cx.fill();}
}
// ---------- Intro ----------
let introT=0;
const INTRO=[['MATH',96,'#ffc21a',1],['STARFIGHTERS',46,'#7ae8ff',1],['',30],['MISIÓN 1',26,'#9cf',1],['',20],
 ['En un rincón muy lejano',36],['de otra galaxia,',36],['un joven piloto estelar',36,'#ffd23f'],['sube a bordo de su nave',36],['para su misión más difícil.',36],['',30],
 ['Muros, asteroides, láseres',36],['y cazas de la Estación Oscura',36],['quieren frenar su avance.',36],['',30],
 ['Solo un piloto rápido,',36],['listo y valiente',36],['puede atravesarlos...',36],['¡y resolver sus enigmas!',36,'#ffd23f'],['',30],
 ['¡Prepárate, piloto!',44,'#7dff9a',1],['La galaxia confía en ti.',38,'#7dff9a']];
function finishIntro(){save.introSeen=true;persist();scr='map';mapSel=-1;}
function drawIntro(){
  drawBG(menuScroll*.3,'space',lastDt,0);introT+=lastDt;overlay(.62);vignette();
  let y=H+60-introT*62;
  for(const [t,sz,col,ti] of INTRO){y+=sz*1.25;if(y<-60||y>H+60||!t)continue;
    const a=clamp((y-40)/160,0,1)*clamp((H+20-y)/120,0,1);cx.globalAlpha=a;
    if(ti)glowT(t,W/2,y,fitSize(t,sz,W*.9,FT,900),col);else txtO(t,W/2,y,fitSize(t,sz,W*.9),col||'#e8f4ff','rgba(0,0,10,.9)',6);}
  cx.globalAlpha=1;if(y<-80)finishIntro();
  txt('TOCA PARA SALTAR ▶',W-24,H-26,14,'rgba(255,255,255,.6)','right',800,FT);
}

// ================== BUCLE ==================
let last=performance.now(),lastDt=0;
let lastMenuTheme='space';
function menuTheme(){const k=THEME_KEYS[Math.floor(clock/7)%THEME_KEYS.length];if(themeCache[k])lastMenuTheme=k;return themeCache[lastMenuTheme]?lastMenuTheme:'space';}
function draw(){
  buttons=[];
  cx.setTransform(scale*dpr,0,0,scale*dpr,0,0);
  bgNoMid=(scr==='map'||scr==='intro'||scr==='hangar'||scr==='menu'||scr==='about');
  if(scr==='menu')drawMenu();else if(scr==='map')drawMap();else if(scr==='hangar')drawHangar();else if(scr==='intro')drawIntro();else if(scr==='about')drawAbout();else if(G)drawPlay();
  drawHyper(lastDt);if(hyper)buttons=[];
  if(portrait){cx.fillStyle='rgba(0,0,0,.85)';cx.fillRect(0,0,W,H);buttons=[];txtO('📱 ↻',W/2,H/2-60,80,'#fff','#000',6);txtO('Gira el móvil',W/2,H/2+40,fitSize('Gira el móvil',60,W*.9),'#fff','#000',7);}
}
function frame(now){const dt=Math.min(.033,Math.max(0,(now-last)/1000));last=now;lastDt=dt;if(scr==='menu'){const nk=THEME_KEYS[Math.floor((clock+1.5)/7)%THEME_KEYS.length];if(!themeCache[nk])getTheme(nk);}update(dt);S.music(save.muted?null:wantedMusic());draw();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ================== ENTRADA ==================
function toLogical(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};}
function tryFullscreen(){try{const d=document.documentElement;if(!document.fullscreenElement&&d.requestFullscreen){const p=d.requestFullscreen();if(p&&p.then)p.then(()=>{try{screen.orientation.lock('landscape').catch(()=>{});}catch(e){}}).catch(()=>{});}}catch(e){}}
function hitButtons(p){for(let i=buttons.length-1;i>=0;i--){const b=buttons[i];if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h){S.sfx('click');b.fn();return true;}}return false;}
function onDown(p,id){
  S.init();if(AC&&AC.state==='suspended')AC.resume();
  if(portrait||hyper)return;
  if(scr==='intro'){if(introT>.4)finishIntro();return;}
  if(scr!=='play'||!G||paused||G.won){if(scr==='menu')tryFullscreen();hitButtons(p);return;}
  if(G.dead){if(G.deadT>.35)retry();pointers.add(id);return;}
  if(p.x>W-110&&p.y<100){paused=true;pointers.clear();return;}
  pointers.add(id);
}
cv.addEventListener('pointerdown',e=>{e.preventDefault();onDown(toLogical(e),e.pointerId);},{passive:false});
const up=e=>{pointers.delete(e.pointerId);};
window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);
cv.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'){e.preventDefault();S.init();
    if(scr==='play'&&G&&!paused){if(G.dead&&G.deadT>.35)retry();keyHold=true;}}
  if(e.code==='Escape'||e.code==='KeyP'){if(scr==='play'&&G&&!G.dead&&!G.won)paused=!paused;}
});
window.addEventListener('keyup',e=>{if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW')keyHold=false;});
document.addEventListener('visibilitychange',()=>{if(document.hidden){pointers.clear();keyHold=false;if(scr==='play'&&G&&!G.dead&&!G.won)paused=true;S.suspend();}else S.resume();});
// Botón atrás de Android (lo llama la app nativa). Devuelve true si el juego lo gestiona.
window.androidBack=function(){
  if(scr==='play'&&G){if(!paused&&!G.won&&!G.dead){paused=true;return true;}if(paused){paused=false;return true;}scr=G.endless?'menu':'map';mapSel=-1;return true;}
  if(scr==='map'&&mapSel>=0){mapSel=-1;return true;}
  if(scr==='map'||scr==='hangar'||scr==='about'){scr='menu';return true;}
  if(scr==='intro'){finishIntro();return true;}
  return false;
};
</script>
