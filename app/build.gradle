plugins {
    id 'com.android.application'
}

// Firma de release opcional: crea un archivo keystore.properties en la raíz
// (está en .gitignore y NUNCA se sube) con:
//   storeFile=/ruta/a/tu-clave.p12
//   storePassword=...
//   keyAlias=...
//   keyPassword=...
// Si no existe, el build de release se firma con la clave de depuración.
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'com.pendatkill.mathstarfighters'
    compileSdk 36

    defaultConfig {
        applicationId "com.pendatkill.mathstarfighters"
        minSdk 24
        targetSdk 36
        versionCode 5
        versionName "1.3.1"
    }

    signingConfigs {
        if (keystorePropsFile.exists()) {
            release {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystorePropsFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
